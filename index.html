  const uid = `${primaryColor}-${size}`.replace(/[^a-zA-Z0-9]/g, '');

    <svg viewBox="0 0 160 320" width={w} height={Math.round(w * 1.4)} xmlns="http://www.w3.org/2000/svg" style={{ display: 'block' }}>
      <defs>
        <linearGradient id={`screen-${uid}`} x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#2a2a30" /><stop offset="100%" stopColor="#0a0a14" /></linearGradient>

        <filter id={`shadow-${uid}`} x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" /><feOffset dx="0" dy="6" /><feComponentTransfer><feFuncA type="linear" slope="0.18" /></feComponentTransfer><feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge></filter>
      </defs>
      <rect x="20" y="10" width="120" height="300" rx="22" fill={`url(#body-${uid})`} filter={`url(#shadow-${uid})`} />
      <rect x="20" y="10" width="120" height="300" rx="22" fill="none" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5" />
      <rect x="26" y="16" width="108" height="288" rx="17" fill={`url(#screen-${uid})`} />

      {isApple && <rect x="58" y="22" width="44" height="10" rx="5" fill="#000" />}

// ============ MAIN ============
function CintexWireless() {
  const [lang, setLang] = useState('en');
  const t = T[lang];
  const [route, setRoute] = useState('home');
  const [cart, setCart] = useState([]);
  const [wishlist, setWishlist] = useState([]);
  const [mobileMenu, setMobileMenu] = useState(false);
  const [orderId, setOrderId] = useState(null);
  const [toast, setToast] = useState(null);
  const [phoneDetail, setPhoneDetail] = useState(null);
  const [phoneFilter, setPhoneFilter] = useState({ brand: 'all', priceRange: 'all', sort: 'featured' });
  const [accFilter, setAccFilter] = useState('all');
  const [byod, setByod] = useState({ zip: '', imei: '', result: null, checking: false });
  const [coverage, setCoverage] = useState({ selected: null, hovered: null, zip: '', result: null });
  const [openFaq, setOpenFaq] = useState(0);
  const [promoCode, setPromoCode] = useState('');
  const [promoApplied, setPromoApplied] = useState(null);
  const [checkoutStep, setCheckoutStep] = useState(1);
  const [savings, setSavings] = useState({ bill: '', result: null });
  const [intlSearch, setIntlSearch] = useState('');
  const [intlType, setIntlType] = useState('all');
  const [tradein, setTradein] = useState({ brand: '', model: '', condition: '', quote: null });
  const [chatOpen, setChatOpen] = useState(false);
  const [bundleModal, setBundleModal] = useState(null);
  const [referralCopied, setReferralCopied] = useState(false);
  const [addonFilter, setAddonFilter] = useState('all');
  const [autopayOn, setAutopayOn] = useState(true);
  const [points] = useState(2480);
  const [moreMenuOpen, setMoreMenuOpen] = useState(false);
  const [openDropdown, setOpenDropdown] = useState(null);
  const ddTimerRef = useRef(null);
  const openDD = (name) => { clearTimeout(ddTimerRef.current); setOpenDropdown(name); };
  const closeDD = () => { ddTimerRef.current = setTimeout(() => setOpenDropdown(null), 120); };

  useEffect(() => { if (toast) { const x = setTimeout(() => setToast(null), 3000); return () => clearTimeout(x); } }, [toast]);

  const cartCount = cart.reduce((s, i) => s + i.qty, 0);
  const cartSubtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const discount = promoApplied ? (promoApplied.type === 'pct' ? cartSubtotal * promoApplied.value : Math.min(promoApplied.value, cartSubtotal)) : 0;
  const subtotalAfterDiscount = cartSubtotal - discount;
  const tax = subtotalAfterDiscount * 0.0825;
  const cartTotal = subtotalAfterDiscount + tax;

  const addToCart = (item, type, options = {}) => {
    setCart((c) => {
      const cartId = options.cartId || item.id;
      const existing = c.find((x) => x.cartId === cartId);
      if (existing) return c.map((x) => (x.cartId === cartId ? { ...x, qty: x.qty + 1 } : x));
      return [...c, { ...item, ...options, type, qty: 1, cartId }];
    });
    const itemName = typeof item.name === 'object' ? item.name[lang] : item.name;
    setToast({ type: 'success', msg: `${itemName} ${t.cart.added}` });
  };
  const openBundleModal = (phone, options = {}) => {
    setBundleModal({ phone, color: options.selectedColor || phone.colors[0], colorIdx: options.colorIdx ?? 0, storage: options.selectedStorage || phone.storage });
  };
  const addBundleToCart = (phone, plan, color, storage, colorIdx, duration) => {
    const phoneCartId = `${phone.id}-${colorIdx}-${storage}-bundle`;
    const planCartId = `${plan.id}-bundle-${phoneCartId}`;
    const months = duration?.months || 1;
    const discount = duration?.discount || 0;
    const monthlyPrice = plan.price * (1 - discount);
    const planTotal = monthlyPrice * months;
    setCart((c) => {
      let next = [...c];
      next.push({ ...phone, type: 'phone', qty: 1, cartId: phoneCartId, selectedColor: color, selectedStorage: storage, colorIdx, bundledPlanId: plan.id });
      next.push({ ...plan, type: 'plan', qty: 1, cartId: planCartId, bundledPhoneId: phoneCartId, price: planTotal, monthlyPrice, durationMonths: months, durationDiscount: discount });
      return next;
    });
    setToast({ type: 'success', msg: `${phone.brand} ${phone.name} + ${plan.name} (${months}mo) ${t.cart.added}` });
    setBundleModal(null);
    go('cart');
  };
  const closeBundleModal = () => setBundleModal(null);
  const updateQty = (cartId, delta) => setCart((c) => c.map((x) => (x.cartId === cartId ? { ...x, qty: Math.max(0, x.qty + delta) } : x)).filter((x) => x.qty > 0));
  const removeItem = (cartId) => {
    setCart((c) => {
      const item = c.find((x) => x.cartId === cartId);
      if (!item) return c;
      // If removing a bundled phone, also remove its bundled plan, and vice versa
      return c.filter((x) => {
        if (x.cartId === cartId) return false;
        if (item.bundledPlanId && x.bundledPhoneId === cartId) return false;
        if (item.bundledPhoneId && x.cartId === item.bundledPhoneId) return false;
        return true;
      });
    });
    setToast({ type: 'info', msg: t.cart.removed });
  };
  const toggleWishlist = (id) => { setWishlist((w) => w.includes(id) ? w.filter((x) => x !== id) : [...w, id]); };

  const applyPromo = () => {
    const code = promoCode.toUpperCase().trim();
    if (code === 'CINTEX10') { setPromoApplied({ code, type: 'pct', value: 0.10, label: '10% off' }); setToast({ type: 'success', msg: '10% off applied' }); }
    else if (code === 'WELCOME20') { setPromoApplied({ code, type: 'amount', value: 20, label: '$20 off' }); setToast({ type: 'success', msg: '$20 off applied' }); }
    else if (code === 'FAMILIA15') { setPromoApplied({ code, type: 'pct', value: 0.15, label: '15% off' }); setToast({ type: 'success', msg: '15% off applied' }); }
    else { setToast({ type: 'error', msg: t.cart.invalid }); setPromoApplied(null); }
  };

  const go = (r, ctx = {}) => { if (ctx.phone) setPhoneDetail(ctx.phone); setRoute(r); setMobileMenu(false); setCheckoutStep(1); if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'instant' }); };

  const checkBYOD = () => {
    if (!byod.zip || byod.zip.length < 5) { setByod({ ...byod, result: { ok: false, msg: t.coverage.zipErr } }); return; }
    setByod({ ...byod, checking: true });
    setTimeout(() => {
      const cov = 90 + Math.random() * 9;
      const imeiOk = !byod.imei || byod.imei.length === 15;
      if (!imeiOk) { setByod((b) => ({ ...b, checking: false, result: { ok: false, msg: 'IMEI must be 15 digits.' } })); return; }
      setByod((b) => ({ ...b, checking: false, result: { ok: true, msg: `${cov.toFixed(0)}% 5G coverage in ${b.zip}.`, imeiMsg: byod.imei ? 'Phone is compatible.' : null } }));
    }, 1200);
  };

  const checkCoverageZip = () => {
    if (!coverage.zip || coverage.zip.length < 5) { setCoverage({ ...coverage, result: { ok: false, msg: t.coverage.zipErr } }); return; }
    setCoverage({ ...coverage, result: { ok: true, coverage: (88 + Math.random() * 11).toFixed(0), towers: Math.floor(40 + Math.random() * 30) } });
  };

  const calculateSavings = () => {
    const bill = parseFloat(savings.bill);
    if (!bill || bill < 10) { setToast({ type: 'error', msg: 'Enter a valid amount' }); return; }
    const cintexPrice = bill > 60 ? 35 : bill > 35 ? 25 : 15;
    const monthlySaving = Math.max(0, bill - cintexPrice);
    const yearly = monthlySaving * 12;
    setSavings({ ...savings, result: { monthly: monthlySaving, yearly, cintexPrice } });
  };

  const computeTradeinQuote = () => {
    if (!tradein.brand || !tradein.model || !tradein.condition) { setToast({ type: 'error', msg: t.tradein.pickFirst }); return; }
    const brandData = TRADEIN_BRANDS.find(b => b.brand === tradein.brand);
    const modelData = brandData?.models.find(m => m.name === tradein.model);
    if (!modelData) return;
    const multipliers = { excellent: 1.0, good: 0.75, fair: 0.5, broken: 0.2 };
    const value = Math.round(modelData.base * multipliers[tradein.condition]);
    setTradein({ ...tradein, quote: value });
  };

  const filteredPhones = useMemo(() => {
    let list = [...PHONES];
    if (phoneFilter.brand !== 'all') list = list.filter((p) => p.brand.toLowerCase() === phoneFilter.brand);
    if (phoneFilter.priceRange === 'under-200') list = list.filter((p) => p.price < 200);
    else if (phoneFilter.priceRange === '200-500') list = list.filter((p) => p.price >= 200 && p.price < 500);
    else if (phoneFilter.priceRange === '500+') list = list.filter((p) => p.price >= 500);
    if (phoneFilter.sort === 'price-asc') list.sort((a, b) => a.price - b.price);
    else if (phoneFilter.sort === 'price-desc') list.sort((a, b) => b.price - a.price);
    else if (phoneFilter.sort === 'rating') list.sort((a, b) => b.rating - a.rating);
    return list;
  }, [phoneFilter]);

  const filteredAcc = useMemo(() => accFilter === 'all' ? ACCESSORIES : ACCESSORIES.filter((a) => a.category.toLowerCase() === accFilter), [accFilter]);

  const filteredCountries = useMemo(() => {
    let list = [...COUNTRIES];
    if (intlSearch) {
      const q = intlSearch.toLowerCase();
      list = list.filter(c => c.name.en.toLowerCase().includes(q) || c.name.es.toLowerCase().includes(q));
    }
    list.sort((a, b) => (b.popular ? 1 : 0) - (a.popular ? 1 : 0));
    return list;
  }, [intlSearch]);

  return (
    <div className="cintex-app">
      <CintexStyles />

      {toast && (
        <div className={`cx-toast ${toast.type === 'error' ? 'error' : ''}`}>
          {toast.type === 'success' ? <Check size={16} /> : toast.type === 'error' ? <X size={16} /> : <Info size={16} />}
          {toast.msg}
        </div>
      )}

      {/* Live chat widget */}
      <div className={`cx-chat-widget ${chatOpen ? 'open' : ''}`}>
        {chatOpen ? (
          <div className="cx-chat-panel">
            <div className="cx-chat-header">
              <div>
                <div style={{fontWeight: 600, fontSize: 14}}>{lang === 'en' ? 'Cintex Support' : 'Soporte Cintex'}</div>
                <div style={{fontSize: 11, color: 'var(--green)'}}>● {lang === 'en' ? 'Online · English & Español' : 'En línea · English & Español'}</div>
              </div>
              <button onClick={() => setChatOpen(false)} className="cx-chat-close"><X size={16} /></button>
            </div>
            <div className="cx-chat-body">
              <div className="cx-chat-msg agent">
                <div className="cx-chat-avatar">M</div>
                <div className="cx-chat-bubble">
                  {lang === 'en' ? 'Hi! I\'m María from Cintex support. How can I help you today?' : '¡Hola! Soy María del soporte Cintex. ¿En qué puedo ayudarte hoy?'}

              <input className="cx-chat-input" placeholder={lang === 'en' ? 'Type a message...' : 'Escribe un mensaje...'} />

            </div>

          <button className="cx-chat-fab" onClick={() => setChatOpen(true)}>
            <MessageCircle size={20} />
            <span className="cx-chat-fab-pulse"></span>
          </button>
        )}
      </div>

      <div className="cx-announce">

      <nav className="cx-nav">

                  <div className="cx-form-field"><label className="cx-input-label">{t.checkout.cardName}</label><input className="cx-input" value={payment.cardName} onChange={(e) => setPayment({...payment, cardName: e.target.value})} /></div>
                  <div className="cx-form-grid">
                    <div className="cx-form-field"><label className="cx-input-label">{t.checkout.cardExp}</label><input className="cx-input" placeholder="MM/YY" value={payment.cardExp} onChange={(e) => setPayment({...payment, cardExp: e.target.value})} /></div>

                    <span><Lock size={12} /> {t.checkout.enc}</span>
                    <span><Shield size={12} /> {t.checkout.fraud}</span>
                    <span><CreditCard size={12} /> {t.checkout.cards}</span>
                  </div>
                  <div style={{display: 'flex', gap: 12, marginTop: 20}}>
                    <button className="cx-btn cx-btn-ghost" onClick={() => setStep(2)}>{t.checkout.backBtn}</button>
                    <button className="cx-btn cx-btn-accent cx-btn-lg" style={{flex: 1}} onClick={placeOrder}>

                  <div style={{fontSize: 11, color: 'var(--muted)', marginTop: 12, textAlign: 'center'}}>
                    {t.checkout.agreeTerms} <a href="#" style={{color: 'var(--accent-text)'}}>{t.checkout.terms}</a>.
                  </div>
                </>
              ) : <div style={{fontSize: 13, color: 'var(--muted)'}}>...</div>}
            </div>
          </div>

          <div className="cx-summary">
            <h3 className="cx-summary-title">{t.cart.summary}</h3>
            {cart.map((item) => {
              const itemName = typeof item.name === 'object' ? item.name[lang] : item.name;
              return (
                <div key={item.cartId} className="cx-summary-row" style={{fontSize: 13}}>
                  <span>{itemName} × {item.qty}</span>
                  <span>{formatPrice(item.price * item.qty)}</span>

            <div className="cx-summary-row"><span>{t.cart.subtotal}</span><span>{formatPrice(subtotal)}</span></div>
            {discount > 0 && <div className="cx-summary-row cx-summary-discount"><span>{t.cart.discount}</span><span>-{formatPrice(discount)}</span></div>}
            <div className="cx-summary-row"><span>{t.cart.tax}</span><span>{formatPrice(tax)}</span></div>
            <div className="cx-summary-row"><span>{t.cart.shipping}</span><span style={{color: 'var(--green)'}}>{t.cart.shipFree}</span></div>
            <div className="cx-summary-row cx-summary-total"><span>{t.cart.total}</span><span>{formatPrice(total)}</span></div>
          </div>
        </div>
      </div>
    </section>
  );
}

function PlanCard({ t, lang, plan, onAdd }) {
  const [duration, setDuration] = useState(DURATIONS[0]);
  const monthlyEffective = plan.price * (1 - duration.discount);
  const showSavings = duration.discount > 0;
  return (
    <div className={`cx-plan-card ${plan.tag === 'mostPop' ? 'featured' : ''}`}>
      {plan.tag && <div className="cx-plan-tag">{plan.tag === 'mostPop' ? t.plans.mostPop : t.plans.bestVal}</div>}
      <div className="cx-plan-name">{plan.name}</div>
      <div className="cx-plan-data">{plan.data}{plan.id === 'p-essential' || plan.id === 'p-plus' ? (lang === 'en' ? ' high-speed' : ' alta velocidad') : ''}</div>
      <div className="cx-plan-bestfor">{plan.bestFor[lang]}</div>
      <div className="cx-plan-price">
        <span className="cx-plan-price-num">${monthlyEffective.toFixed(monthlyEffective % 1 === 0 ? 0 : 2)}</span>
        <span className="cx-plan-price-suf">/mo</span>
      </div>
      {showSavings ? (
        <div className="cx-plan-price-meta" style={{color: 'var(--green)'}}>
          {lang === 'en' ? 'Save' : 'Ahorras'} ${((plan.price - monthlyEffective) * duration.months).toFixed(0)} {lang === 'en' ? `over ${duration.months} months` : `en ${duration.months} meses`}
        </div>
      ) : (
        <div className="cx-plan-price-meta">{plan.perLine ? t.plans.perLine : t.plans.taxes}</div>
      )}

      {/* Duration pills */}
      <div className="cx-plan-duration-pills">
        {DURATIONS.map(d => (
          <button key={d.months} className={`cx-plan-duration-pill ${duration.months === d.months ? 'active' : ''} ${d.months === 12 ? 'best' : ''}`} onClick={() => setDuration(d)}>
            {d.months}{lang === 'en' ? 'mo' : 'mes'}
            {d.discount > 0 && <span className="cx-plan-duration-disc">-{Math.round(d.discount * 100)}%</span>}
          </button>
        ))}
      </div>

      <ul className="cx-plan-features">
        {plan.features[lang].map((f, i) => (
          <li key={i}><Check size={14} className="cx-plan-feature-check" />{f}</li>
        ))}
      </ul>
      <button className={`cx-btn ${plan.tag === 'mostPop' ? 'cx-btn-accent' : 'cx-btn-primary'}`} style={{width: '100%'}} onClick={() => onAdd(duration)}>
        {t.plans.choose}{plan.name}
        {duration.months > 1 && <span style={{fontSize: 11, opacity: 0.85, marginLeft: 6}}>· ${(monthlyEffective * duration.months).toFixed(0)}</span>}
      </button>
    </div>
  );
}

      <div className="cx-phone-colors">
        {phone.colors.map((c, i) => (
          <button key={i} className={`cx-phone-color ${colorIdx === i ? 'active' : ''}`} style={{background: c}} onClick={(e) => { e.stopPropagation(); setColorIdx(i); }} />

        <Sparkles size={11} style={{color: 'var(--accent)'}} />

        <button className="cx-btn cx-btn-primary cx-btn-sm" style={{flex: 1}} onClick={() => openBundleModal(phone, { colorIdx, selectedColor: phone.colors[colorIdx], selectedStorage: phone.storage })}>{t.phones.addCart}</button>
      </div>

// ============ BUNDLE MODAL ============
function BundleModal({ t, lang, bundle, setBundle, onClose, onConfirm }) {
  const [selectedPlan, setSelectedPlan] = useState(PLANS.find(p => p.tag === 'mostPop') || PLANS[1]);
  const [selectedDuration, setSelectedDuration] = useState(DURATIONS[0]);
  const phone = bundle.phone;
  const monthlyBase = selectedPlan.price;
  const monthlyDiscounted = monthlyBase * (1 - selectedDuration.discount);
  const planTotal = monthlyDiscounted * selectedDuration.months;
  const dueToday = phone.price + planTotal;
  const monthlySavings = (monthlyBase - monthlyDiscounted) * selectedDuration.months;
  const perks = PLAN_PERKS[selectedPlan.id] || [];

  return (
    <div className="cx-modal-backdrop" onClick={onClose}>
      <div className="cx-modal" onClick={(e) => e.stopPropagation()}>
        <button className="cx-modal-close" onClick={onClose}><X size={20} /></button>
        <div className="cx-modal-header">
          <div className="cx-section-eyebrow" style={{color: 'var(--accent-deep)'}}>
            <Sparkles size={11} style={{verticalAlign: 'middle', marginRight: 4}} />
            {lang === 'en' ? 'Bundle deal' : 'Oferta combinada'}
          </div>
          <h2 className="cx-modal-title">{t.bundle.title}</h2>
          <p className="cx-modal-sub">{t.bundle.sub}</p>
        </div>

        <div className="cx-modal-body">
          {/* Selected phone */}
          <div className="cx-modal-phone">
            <div className="cx-modal-phone-image">
              <PhoneSvg brand={phone.brand} primaryColor={bundle.color} size="sm" />
            </div>
            <div style={{flex: 1}}>
              <div className="cx-section-eyebrow">{t.bundle.pickedPhone}</div>
              <div style={{fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 600, marginTop: 2}}>{phone.brand} {phone.name}</div>
              <div style={{fontSize: 13, color: 'var(--muted)', marginTop: 2}}>{bundle.storage}</div>
            </div>
            <div style={{textAlign: 'right'}}>
              <div style={{fontFamily: 'Fraunces, serif', fontSize: 22, fontWeight: 600}}>${phone.price}</div>
              <div style={{fontSize: 12, color: 'var(--muted)', textDecoration: 'line-through'}}>${phone.marketPrice}</div>
            </div>
          </div>

          {/* Plan selection */}
          <div style={{marginTop: 24}}>
            <div className="cx-section-eyebrow" style={{marginBottom: 12}}>{t.bundle.pickPlan}</div>
            <div className="cx-modal-plans">
              {PLANS.map(plan => {
                const isSelected = selectedPlan.id === plan.id;
                return (
                  <div key={plan.id} className={`cx-modal-plan ${isSelected ? 'active' : ''} ${plan.tag === 'mostPop' ? 'featured' : ''}`} onClick={() => setSelectedPlan(plan)}>
                    {plan.tag && <div className="cx-modal-plan-tag">{plan.tag === 'mostPop' ? t.bundle.mostPop : t.bundle.bestVal}</div>}
                    <div className="cx-modal-plan-radio"></div>
                    <div style={{flex: 1, minWidth: 0}}>
                      <div style={{display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap'}}>
                        <div style={{fontFamily: 'Fraunces, serif', fontSize: 16, fontWeight: 600}}>{plan.name}</div>
                        <div style={{fontSize: 12, color: 'var(--accent-deep)', fontWeight: 600}}>{plan.data}</div>
                      </div>
                      <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 2}}>{plan.bestFor[lang]}</div>
                    </div>
                    <div style={{textAlign: 'right'}}>
                      <div style={{fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 600}}>${plan.price}</div>
                      <div style={{fontSize: 11, color: 'var(--muted)'}}>/mo</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Plan duration selector */}
          <div style={{marginTop: 24}}>
            <div className="cx-section-eyebrow" style={{marginBottom: 12}}>{t.duration.title}</div>
            <div className="cx-duration-grid">
              {DURATIONS.map(d => {
                const isSelected = selectedDuration.months === d.months;
                const monthlyPrice = (selectedPlan.price * (1 - d.discount));
                return (
                  <div key={d.months} className={`cx-duration-card ${isSelected ? 'active' : ''} ${d.months === 12 ? 'best' : ''}`} onClick={() => setSelectedDuration(d)}>
                    {d.badge_en && <div className="cx-duration-badge">{d.months === 12 ? t.duration.yearlyBest : (lang === 'en' ? d.badge_en : d.badge_es)}</div>}
                    <div className="cx-duration-months">{d.months} {d.months === 1 ? (lang === 'en' ? 'month' : 'mes') : (lang === 'en' ? 'months' : 'meses')}</div>
                    <div className="cx-duration-price">${monthlyPrice.toFixed(2)}<span style={{fontSize: 11, color: 'var(--muted)'}}>{t.duration.perMonth}</span></div>
                    {d.discount > 0 && <div className="cx-duration-saved">{lang === 'en' ? 'Save' : 'Ahorras'} ${((selectedPlan.price - monthlyPrice) * d.months).toFixed(0)}</div>}

                );
              })}
            </div>
          </div>

          {/* Perks for selected plan */}
          {perks.length > 0 && (
            <div className="cx-modal-perks">

                  <div key={i} className="cx-modal-perk-item">
                    <Check size={14} style={{color: 'var(--green)'}} />

                  </div>

            </div>
          )}

          {/* Pricing summary */}
          <div className="cx-modal-summary">
            <div className="cx-modal-summary-row">
              <span>{phone.brand} {phone.name}</span>
              <span>${phone.price}</span>
            </div>
            <div className="cx-modal-summary-row">
              <span>{selectedPlan.name} × {selectedDuration.months} {selectedDuration.months === 1 ? (lang === 'en' ? 'month' : 'mes') : (lang === 'en' ? 'months' : 'meses')}</span>
              <span>${planTotal.toFixed(2)}</span>
            </div>
            {monthlySavings > 0 && (
              <div className="cx-modal-summary-row" style={{color: 'var(--green)', fontWeight: 600}}>
                <span>{t.duration.youSave}</span>
                <span>−${monthlySavings.toFixed(2)}</span>
              </div>
            )}
            <div className="cx-modal-summary-row total">
              <span>{t.bundle.dueToday}</span>
              <span>${dueToday.toFixed(2)}</span>
            </div>
            <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 6, textAlign: 'right'}}>
              ${monthlyDiscounted.toFixed(2)}/mo {lang === 'en' ? 'effective rate' : 'tarifa efectiva'}
            </div>
          </div>

          <div style={{fontSize: 11, color: 'var(--muted)', marginTop: 14, textAlign: 'center'}}>
            {t.bundle.perksNote}
          </div>
        </div>

        <div className="cx-modal-footer">
          <button className="cx-btn cx-btn-ghost" onClick={onClose}>{t.bundle.cancel}</button>
          <button className="cx-btn cx-btn-accent cx-btn-lg" style={{flex: 1}} onClick={() => onConfirm(phone, selectedPlan, bundle.color, bundle.storage, bundle.colorIdx, selectedDuration)}>
            {t.bundle.addToCart} · ${dueToday.toFixed(2)} <ArrowRight size={14} />
          </button>
        </div>
      </div>
    </div>
  );
}

        <div>
          <div style={{fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700}}>{t.mobileBar.total}</div>
          <div style={{fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 600}}>${cartTotal.toFixed(2)}</div>
        </div>
        <button className="cx-btn cx-btn-accent cx-btn-sm" onClick={() => go('cart')}>
          {t.mobileBar.checkout} ({cartCount}) <ArrowRight size={14} />
        </button>
      </div>
    </div>
  );
}

// ============ BOTTOM NAV (mobile) ============
function BottomNav({ t, lang, route, go, setMoreMenuOpen, cartCount }) {
  const isHome = route === 'home';
  const isPlans = route === 'plans';
  const isPhones = ['phones', 'phone-detail'].includes(route);
  const isAccount = route === 'dashboard';
  const tabs = [
    { id: 'home', icon: Home, label: t.bottomNav.home, active: isHome, onClick: () => go('home') },
    { id: 'plans', icon: Tag, label: t.bottomNav.plans, active: isPlans, onClick: () => go('plans') },
    { id: 'phones', icon: Smartphone, label: t.bottomNav.phones, active: isPhones, onClick: () => go('phones') },
    { id: 'account', icon: User, label: t.bottomNav.account, active: isAccount, onClick: () => go('dashboard') },
    { id: 'more', icon: MoreHorizontal, label: t.bottomNav.more, active: false, onClick: () => setMoreMenuOpen(true) },
  ];
  return (
    <nav className="cx-bottom-nav">
      {tabs.map(tab => {
        const Icon = tab.icon;
        return (
          <button key={tab.id} className={`cx-bottom-nav-tab ${tab.active ? 'active' : ''}`} onClick={tab.onClick}>
            <Icon size={20} />
            <span>{tab.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

// ============ MORE SHEET (mobile drawer) ============
function MoreSheet({ t, lang, go, onClose, setLang }) {
  const items = [
    { icon: Globe, label: t.moreMenu.international, route: 'international' },
    { icon: MapPin, label: t.moreMenu.coverage, route: 'coverage' },
    { icon: Sparkles, label: t.moreMenu.addons, route: 'addons' },
    { icon: RefreshCw, label: t.moreMenu.tradeIn, route: 'tradein' },
    { icon: Award, label: t.moreMenu.perks, route: 'perks' },
    { icon: Star, label: t.moreMenu.compare, route: 'compare' },
    { icon: Users, label: t.moreMenu.remittance, route: 'remittance' },
    { icon: Heart, label: t.moreMenu.wishlist, route: 'wishlist' },
    { icon: MessageCircle, label: t.moreMenu.support, route: 'support' },
  ];
  const handleNav = (r) => { go(r); onClose(); };
  const toggleLang = () => { setLang(lang === 'en' ? 'es' : 'en'); onClose(); };
  return (
    <div className="cx-sheet-backdrop" onClick={onClose}>
      <div className="cx-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="cx-sheet-handle"></div>
        <div className="cx-sheet-header">
          <h3 style={{fontFamily: 'Fraunces, serif', fontSize: 20, fontWeight: 600, margin: 0}}>{t.moreMenu.title}</h3>
          <button className="cx-sheet-close" onClick={onClose}><X size={20} /></button>
        </div>
        <div className="cx-sheet-grid">
          {items.map(item => {
            const Icon = item.icon;
            return (
              <button key={item.route} className="cx-sheet-item" onClick={() => handleNav(item.route)}>
                <div className="cx-sheet-item-icon"><Icon size={20} /></div>
                <span>{item.label}</span>
              </button>
            );
          })}
        </div>
        <button className="cx-sheet-lang" onClick={toggleLang}>
          <Languages size={18} />
          <span>{t.moreMenu.switchLang}</span>
        </button>
      </div>
    </div>
  );
}

.cx-bundle-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--accent-tint); color: var(--accent-deep); border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-left: 8px; }

/* Perks page */
.cx-perks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
.cx-perk-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; transition: all 0.2s; }
.cx-perk-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-color: var(--accent-soft); }
.cx-perk-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.cx-perk-card h3 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 0 0 10px; }
.cx-perk-card p { font-size: 14px; color: var(--ink-soft); margin: 0; line-height: 1.6; }

/* Referral card */
.cx-referral-card { display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center; padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; }
.cx-referral-code-box { background: var(--ink); color: var(--bg); padding: 32px; border-radius: 16px; }
.cx-referral-code-box .cx-section-eyebrow { color: var(--accent) !important; }
.cx-referral-code { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; letter-spacing: 0.02em; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(204,120,92,0.5); border-radius: 12px; text-align: center; }

@media (max-width: 800px) { .cx-referral-card { grid-template-columns: 1fr; padding: 32px 24px; gap: 24px; } }

/* Plan duration pills (in PlanCard) */
.cx-plan-duration-pills { display: flex; gap: 4px; margin: 16px 0 20px; padding: 4px; background: var(--bg-warm); border-radius: 10px; }
.cx-plan-duration-pill { flex: 1; background: transparent; border: none; padding: 8px 6px; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; border-radius: 7px; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cx-plan-duration-pill:hover { background: var(--paper); }
.cx-plan-duration-pill.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.cx-plan-duration-pill.best.active { background: var(--accent); color: white; }
.cx-plan-duration-disc { font-size: 10px; opacity: 0.85; font-weight: 700; }

/* Duration grid (in BundleModal) */
.cx-duration-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cx-duration-card { position: relative; padding: 14px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: all 0.15s; text-align: center; }
.cx-duration-card:hover { border-color: var(--accent-soft); }
.cx-duration-card.active { border-color: var(--accent); background: var(--accent-tint); }
.cx-duration-card.best.active { border-color: var(--accent-deep); background: linear-gradient(135deg, var(--accent-tint), var(--bg-warm)); }
.cx-duration-badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 2px 8px; border-radius: 100px; font-size: 9px; font-weight: 700; white-space: nowrap; }
.cx-duration-card.best .cx-duration-badge { background: var(--accent-deep); }
.cx-duration-months { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.cx-duration-price { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; }
.cx-duration-saved { font-size: 10px; color: var(--green); font-weight: 600; margin-top: 2px; }

@media (max-width: 600px) { .cx-duration-grid { grid-template-columns: 1fr 1fr; gap: 6px; } }

/* Add-ons */
.cx-addons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.cx-addon-card { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px 18px; transition: all 0.2s; display: flex; flex-direction: column; }
.cx-addon-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); border-color: var(--accent-soft); }
.cx-addon-card.popular { border-color: var(--accent-soft); background: linear-gradient(180deg, var(--paper), var(--accent-tint)); }
.cx-addon-popular-tag { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; background: var(--accent); color: white; border-radius: 100px; font-size: 10px; font-weight: 700; }
.cx-addon-icon { font-size: 36px; margin-bottom: 10px; line-height: 1; }
.cx-addon-name { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.cx-addon-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; flex: 1; }
.cx-addon-meta { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px; }
.cx-addon-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.cx-addon-price { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; }

/* Dashboard */
.cx-dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.cx-dash-stat { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.cx-dash-stat-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.cx-dash-stat-num { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 600; line-height: 1; margin: 8px 0 4px; }
.cx-dash-stat-meta { font-size: 12px; color: var(--muted); }

@media (max-width: 800px) { .cx-dash-stats { grid-template-columns: repeat(2, 1fr); } }

.cx-dash-autopay { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: 14px; margin-bottom: 24px; }
.cx-dash-autopay.on { background: var(--green-soft); border: 1px solid rgba(90, 122, 74, 0.2); }
.cx-dash-autopay.off { background: var(--accent-tint); border: 1px solid var(--accent-soft); }
.cx-dash-autopay-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cx-dash-autopay.on .cx-dash-autopay-icon { background: var(--green); color: white; }
.cx-dash-autopay.off .cx-dash-autopay-icon { background: var(--accent); color: white; }

.cx-dash-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }

.cx-dash-lines { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.cx-dash-line { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.cx-dash-line.remittance { border-color: var(--accent-soft); background: linear-gradient(180deg, var(--paper), var(--accent-tint)); }
.cx-dash-remittance-tag { position: absolute; top: 14px; right: 14px; padding: 3px 10px; background: var(--accent); color: white; border-radius: 100px; font-size: 10px; font-weight: 700; }
.cx-dash-line-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.cx-dash-line-avatar { width: 44px; height: 44px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; flex-shrink: 0; }
.cx-dash-line-name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; }
.cx-dash-line-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cx-dash-line-plan { padding: 4px 10px; background: var(--bg-warm); border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.cx-dash-line-data { margin-bottom: 14px; }
.cx-dash-line-data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.cx-dash-data-bar { height: 6px; background: var(--bg-warm); border-radius: 3px; overflow: hidden; }
.cx-dash-data-fill { height: 100%; transition: width 0.3s; border-radius: 3px; }
.cx-dash-line-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line-soft); }

/* Loyalty card */
.cx-loyalty-card { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; margin-top: 40px; padding: 40px; background: linear-gradient(135deg, var(--bg-warm), var(--paper)); border: 1px solid var(--accent-soft); border-radius: 20px; }
.cx-loyalty-actions { background: var(--paper); border-radius: 14px; padding: 24px; }

@media (max-width: 800px) { .cx-loyalty-card { grid-template-columns: 1fr; padding: 28px 20px; } }

/* Remittance */
.cx-remittance-form { max-width: 720px; margin: 60px auto 0; padding: 32px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; }
.cx-remittance-countries { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.cx-remittance-country { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: all 0.15s; font-size: 13px; }
.cx-remittance-country:hover { border-color: var(--accent-soft); }
.cx-remittance-country.active { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-deep); font-weight: 600; }

/* HERO V2 - rebuilt with single focal point */
.cx-heroV2 { padding: 60px 0 40px; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-warm) 100%); position: relative; overflow: hidden; }
.cx-heroV2::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 30%, rgba(255,106,47,0.18) 0%, transparent 70%); pointer-events: none; }
.cx-heroV2-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 60px; align-items: center; }
.cx-heroV2-promo-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: var(--ink); color: var(--bg); border-radius: 100px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
.cx-heroV2-promo-tag svg { color: var(--accent); }
.cx-heroV2-title { font-family: 'Fraunces', serif; font-size: clamp(40px, 6vw, 72px); font-weight: 500; line-height: 1.0; letter-spacing: -0.03em; margin: 20px 0 24px; }
.cx-heroV2-em { font-style: italic; color: var(--accent-text); position: relative; }
.cx-heroV2-em::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0.05em; height: 0.18em; background: var(--accent-tint); z-index: -1; }
.cx-heroV2-sub { font-size: 18px; color: var(--ink-soft); max-width: 540px; margin: 0 0 32px; line-height: 1.5; }
.cx-heroV2-ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
.cx-heroV2-promises { display: flex; gap: 20px; flex-wrap: wrap; }
.cx-heroV2-promise { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.cx-heroV2-promise svg { color: var(--green); flex-shrink: 0; }

.cx-heroV2-right { position: relative; height: 480px; display: flex; align-items: center; justify-content: center; }
.cx-heroV2-visual { position: relative; }
.cx-heroV2-phone { position: relative; z-index: 2; transform: rotate(-4deg); transition: transform 0.3s; filter: drop-shadow(0 30px 60px rgba(0,0,0,0.18)); }
.cx-heroV2-phone:hover { transform: rotate(-2deg) translateY(-4px); }
.cx-heroV2-orb { position: absolute; border-radius: 50%; filter: blur(40px); }
.cx-heroV2-orb-1 { width: 280px; height: 280px; background: rgba(255, 106, 47, 0.15); top: 20%; left: -10%; }
.cx-heroV2-orb-2 { width: 200px; height: 200px; background: rgba(255, 160, 100, 0.12); bottom: 10%; right: -5%; }
.cx-heroV2-pill { position: absolute; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.10); z-index: 3; animation: float 4s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.cx-heroV2-pill-1 { top: 8%; left: -8%; animation-delay: 0s; }
.cx-heroV2-pill-2 { top: 38%; right: -10%; animation-delay: 1.3s; }
.cx-heroV2-pill-3 { bottom: 12%; left: -5%; animation-delay: 2.6s; }

.cx-heroV2-keyprops { display: flex; align-items: center; gap: 0; margin-top: 40px; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
.cx-heroV2-keyprop { display: flex; align-items: center; gap: 14px; padding: 22px 28px; flex: 1; transition: background 0.2s; }
.cx-heroV2-keyprop:hover { background: var(--bg-warm); }
.cx-heroV2-keyprop-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
.cx-heroV2-keyprop-title { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.cx-heroV2-keyprop-sub { font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 500; }
.cx-heroV2-keyprop-divider { width: 1px; height: 52px; background: var(--line); flex-shrink: 0; }

@media (max-width: 900px) {
  .cx-heroV2-grid { grid-template-columns: 1fr; gap: 40px; }
  .cx-heroV2-right { height: 400px; }
  .cx-heroV2-pill-1 { left: 0; }
  .cx-heroV2-pill-2 { right: 0; }
  .cx-heroV2-pill-3 { left: 0; }
  .cx-heroV2-asseenon { flex-direction: column; align-items: flex-start; gap: 16px; }
}

/* Savings section (own section after hero) */
.cx-savings-section { display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: center; padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
.cx-savings-input-row { display: flex; gap: 12px; max-width: 380px; }
.cx-savings-display { background: linear-gradient(135deg, var(--accent-tint), var(--bg-warm)); border-radius: 18px; padding: 36px 24px; min-height: 200px; display: flex; align-items: center; justify-content: center; }
.cx-savings-num-big { font-family: 'Fraunces', serif; font-size: 80px; font-weight: 600; color: var(--accent-deep); line-height: 1; margin: 8px 0; }

@media (max-width: 800px) { .cx-savings-section { grid-template-columns: 1fr; padding: 32px 24px; gap: 32px; } .cx-savings-num-big { font-size: 64px; } }

/* Compare table */
.cx-compare-table-wrap { max-width: 960px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; overflow-x: auto; }
.cx-compare-table { width: 100%; border-collapse: collapse; min-width: 720px; }
.cx-compare-table th { padding: 18px 16px; font-size: 14px; font-weight: 600; text-align: center; background: var(--bg-warm); border-bottom: 1px solid var(--line); }
.cx-compare-th-cintex { background: var(--accent) !important; color: white !important; font-family: 'Fraunces', serif; font-size: 16px !important; }
.cx-compare-table td { padding: 16px; text-align: center; font-size: 14px; border-bottom: 1px solid var(--line-soft); }
.cx-compare-table tr:last-child td { border-bottom: none; }
.cx-compare-cintex-cell { background: var(--accent-tint); }

/* Mobile sticky bar */
.cx-mobile-sticky-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 12px 16px; z-index: 80; box-shadow: 0 -8px 24px rgba(0,0,0,0.08); display: none; }
.cx-mobile-sticky-content { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 600px; margin: 0 auto; }
.cx-mobile-sticky-promo { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink); }

@media (max-width: 768px) {
  .cx-mobile-sticky-bar { display: block; bottom: 64px; }
  .cx-chat-widget { bottom: 132px; right: 16px; }
  .cx-chat-fab { width: 48px; height: 48px; }
  .cintex-app { padding-bottom: 130px; }
}

/* ===== BOTTOM TAB NAV (mobile only) ===== */
.cx-bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: var(--paper); border-top: 1px solid var(--line); z-index: 90; padding: 0 4px; padding-bottom: env(safe-area-inset-bottom, 0); }
.cx-bottom-nav-tab { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 4px; cursor: pointer; color: var(--muted); transition: color 0.15s; min-height: 56px; }
.cx-bottom-nav-tab span { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }
.cx-bottom-nav-tab.active { color: var(--accent-deep); }
.cx-bottom-nav-tab.active svg { stroke-width: 2.5; }
.cx-bottom-nav-tab:active { background: var(--bg-warm); }

@media (max-width: 768px) {
  .cx-bottom-nav { display: flex; }
}

/* ===== MORE SHEET (bottom sheet) ===== */
.cx-sheet-backdrop { position: fixed; inset: 0; background: rgba(26, 25, 21, 0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(2px); animation: fadeIn 0.2s ease; }
.cx-sheet { width: 100%; max-width: 600px; background: var(--bg); border-radius: 24px 24px 0 0; padding: 12px 20px 24px; max-height: 85vh; overflow-y: auto; animation: slideUpSheet 0.3s cubic-bezier(0.32, 0.72, 0, 1); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0)); }
@keyframes slideUpSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
.cx-sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
.cx-sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.cx-sheet-close { background: var(--bg-warm); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.cx-sheet-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.cx-sheet-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; min-height: 90px; text-align: center; transition: all 0.15s; }
.cx-sheet-item:active { background: var(--bg-warm); transform: scale(0.97); }
.cx-sheet-item-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-tint); color: var(--accent-deep); display: flex; align-items: center; justify-content: center; }
.cx-sheet-item span { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.cx-sheet-lang { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: var(--ink); color: var(--bg); border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 48px; }

/* ===== MOBILE-FIRST OVERRIDES ===== */
@media (max-width: 768px) {
  /* Hide top nav links/actions on mobile - bottom nav takes over */
  .cx-nav { background: var(--bg); }
  .cx-nav-inner { height: 56px; padding-left: 16px; padding-right: 16px; }

  /* Hero V2 mobile compact */
  .cx-heroV2 { padding: 32px 0 24px; }
  .cx-heroV2-grid { gap: 32px; }
  .cx-heroV2-title { font-size: 40px; line-height: 1.05; margin: 16px 0 16px; }
  .cx-heroV2-sub { font-size: 15px; margin-bottom: 24px; }
  .cx-heroV2-ctas { flex-direction: column; gap: 8px; }
  .cx-heroV2-ctas .cx-btn { width: 100%; min-height: 52px; }
  .cx-heroV2-promises { gap: 12px; font-size: 12px; }
  .cx-heroV2-right { height: 320px; }
  .cx-heroV2-pill { padding: 8px 12px; font-size: 11px; }
  .cx-heroV2-pill-1 { left: -4%; }
  .cx-heroV2-pill-2 { right: -4%; }
  .cx-heroV2-pill-3 { display: none; }
  .cx-heroV2-asseenon { margin-top: 24px; padding-top: 20px; }
  .cx-heroV2-logos { gap: 20px; }
  .cx-heroV2-logo span { font-size: 12px !important; }

  /* Section heads */
  .cx-section-head { margin-bottom: 32px; }
  .cx-section-head h2 { font-size: 26px; line-height: 1.15; }

  /* Buttons larger touch targets */
  .cx-btn { min-height: 44px; padding: 12px 18px; }

  /* Plan cards full width on mobile */
  .cx-plans-grid { grid-template-columns: 1fr; gap: 12px; }

  .cx-plan-name { font-size: 20px; }
  .cx-plan-price-num { font-size: 40px; }
  .cx-plan-duration-pill { min-height: 44px; padding: 6px 4px; }

  /* Phone cards 2 per row */
  .cx-phones-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .cx-phone-card { padding: 14px 12px; }
  .cx-phone-name { font-size: 15px; }
  .cx-phone-price-num { font-size: 18px; }
  .cx-phone-card .cx-btn { font-size: 12px; padding: 8px; }

  /* Filter bar wrap */
  .cx-filter-bar { flex-direction: column; align-items: stretch; gap: 12px; }
  .cx-filter-pills { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .cx-filter-pill { white-space: nowrap; flex-shrink: 0; min-height: 40px; padding: 8px 14px; }
  .cx-select { width: 100%; min-height: 44px; }

  /* Hero callout */
  .cx-hero-callout { padding: 14px; gap: 10px; }
  .cx-hero-callout > div:nth-child(2) { flex: 1; }

  /* Savings section mobile */
  .cx-savings-section { padding: 24px 20px; gap: 24px; }
  .cx-savings-num-big { font-size: 56px; }
  .cx-savings-input-row { flex-direction: column; }
  .cx-savings-input-row .cx-btn { width: 100%; min-height: 48px; }

  /* Features grid */
  .cx-features-grid { grid-template-columns: 1fr; gap: 12px; }
  .cx-feature-card { padding: 22px 20px; }
  .cx-feature-card h3 { font-size: 18px; }

  /* International */
  .cx-intl-grid { grid-template-columns: 1fr; gap: 10px; }
  .cx-intl-card { padding: 14px 16px; }
  .cx-intl-flag { font-size: 28px; }

  /* International compare rows already mobile-friendly */
  .cx-compare-row { padding: 14px 16px; }

  /* BYOD */
  .cx-byod { padding: 32px 20px; gap: 24px; }
  .cx-byod h2 { font-size: 28px; }
  .cx-byod-form { padding: 22px; }

  /* Coverage */
  .cx-coverage-grid { gap: 16px; }
  .cx-coverage-map-wrap { padding: 18px; }

  /* Cart */
  .cx-cart-grid { gap: 16px; }
  .cx-cart-item { padding: 14px; gap: 12px; flex-wrap: wrap; }
  .cx-cart-item-image { width: 56px; height: 72px; }
  .cx-cart-item-name { font-size: 14px; }
  .cx-cart-item-price { font-size: 16px; }
  .cx-cart-item-actions { width: 100%; }
  .cx-summary { padding: 22px; }
  .cx-summary-title { font-size: 18px; }

  /* Checkout */
  .cx-checkout-grid { gap: 16px; }
  .cx-checkout-section { padding: 22px 20px; }
  .cx-form-grid { grid-template-columns: 1fr; gap: 8px; }

  /* Modals → bottom sheet style on mobile */
  .cx-modal-backdrop { padding: 0; align-items: flex-end; }
  .cx-modal { max-height: 92vh; height: auto; border-radius: 24px 24px 0 0; max-width: 100%; animation: slideUpSheet 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
  .cx-modal::before { content: ''; display: block; width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 12px auto 0; }
  .cx-modal-header { padding: 16px 20px 8px; }
  .cx-modal-title { font-size: 22px; }
  .cx-modal-body { padding: 0 20px 12px; }
  .cx-modal-footer { padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0)); flex-direction: column-reverse; gap: 8px; }
  .cx-modal-footer .cx-btn { width: 100%; min-height: 52px; }

  /* Bundle modal duration grid - 2 cols on mobile */
  .cx-duration-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .cx-duration-card { padding: 16px 10px; min-height: 88px; }

  /* Modal plans */
  .cx-modal-plan { padding: 14px 14px; min-height: 64px; }

  /* Phone detail */
  .cx-phone-detail-grid { gap: 24px; }
  .cx-phone-detail-image { padding: 28px; }
  .cx-phone-detail-image svg { max-width: 200px; }
  .cx-phone-detail-thumb { width: 56px; height: 70px; min-width: 56px; }

  /* Dashboard */
  .cx-dash-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
  .cx-dash-stat { padding: 16px 14px; }
  .cx-dash-stat-num { font-size: 28px; }
  .cx-dash-line { padding: 18px; }
  .cx-dash-actions { flex-direction: column; }
  .cx-dash-actions .cx-btn { width: 100%; }
  .cx-loyalty-card { padding: 24px 20px; gap: 20px; }

  /* Add-ons */
  .cx-addons-grid { grid-template-columns: 1fr; gap: 12px; }
  .cx-addon-card { padding: 18px 18px 16px; }

  /* Trade-in */
  .cx-tradein-steps { grid-template-columns: 1fr; gap: 10px; }
  .cx-tradein-step { padding: 16px; }
  .cx-tradein-form { padding: 22px 20px; }
  .cx-tradein-quote { padding: 22px; min-height: auto; }

  /* Perks */
  .cx-perks-grid { grid-template-columns: 1fr; gap: 12px; }
  .cx-perk-card { padding: 22px 20px; }
  .cx-referral-card { padding: 24px 20px; gap: 20px; }
  .cx-referral-code { font-size: 22px; padding: 12px 14px; }

  /* Compare */
  .cx-compare-table { min-width: 540px; font-size: 12px; }
  .cx-compare-table th { padding: 12px 8px; font-size: 12px; }
  .cx-compare-table td { padding: 12px 8px; font-size: 12px; }

  /* Footer */
  .cx-footer { padding: 48px 0 24px; margin-top: 48px; }
  .cx-footer-grid { gap: 24px; margin-bottom: 32px; }
  .cx-footer-copy { flex-direction: column; align-items: flex-start; }

  /* Form fields */
  .cx-input { font-size: 16px !important; padding: 13px 14px; min-height: 48px; }
  .cx-input-label { font-size: 13px; }

  /* Inputs in iOS won't zoom if 16px */
  input, textarea, select { font-size: 16px !important; }

  /* Mobile sticky bar */
  .cx-mobile-sticky-bar { padding: 10px 14px; }
  .cx-mobile-sticky-content .cx-btn { min-height: 44px; padding: 10px 14px; }

  /* Touch target boost for all interactive */
  .cx-phone-color { min-width: 28px; min-height: 28px; }
  .cx-phone-detail-color { min-width: 44px; min-height: 44px; }
  .cx-faq-q { padding: 18px 0; min-height: 60px; }
  .cx-faq-q { font-size: 15px; }
  .cx-radio-card { min-height: 64px; }

  /* Avoid 100vw modals creating horizontal scroll */
  body { overflow-x: hidden; }

  /* Section eyebrow smaller */
  .cx-section-eyebrow { font-size: 11px; }

  /* Promo tag */
  .cx-heroV2-promo-tag { font-size: 11px; padding: 5px 12px; }

  /* Wishlist heart in phone card */
  .cx-phone-wishlist { width: 36px; height: 36px; }
}

/* Tablet adjustments 768-1024 */
@media (min-width: 769px) and (max-width: 1024px) {
  .cx-bottom-nav { display: none; }
  .cx-mobile-sticky-bar { display: none; }
  .cintex-app { padding-bottom: 0; }
  .cx-nav-links { gap: 0; }
  .cx-nav-link { padding: 8px 10px; font-size: 13px; }
  .cx-phones-grid { grid-template-columns: repeat(3, 1fr); }
  .cx-features-grid { grid-template-columns: repeat(2, 1fr); }
  .cx-plans-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Hide bottom nav on desktop */
@media (min-width: 1025px) {
  .cx-bottom-nav { display: none; }
}

/* Improve focus states for keyboard accessibility */
.cx-btn:focus-visible, .cx-input:focus-visible, .cx-bottom-nav-tab:focus-visible, .cx-sheet-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
    `}</style>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<CintexWireless />);
